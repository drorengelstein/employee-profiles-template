name = "employee-profiles"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# הנכסים הסטטיים מוגשים ישירות; רק /api עובר דרך ה-Worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# בלי database_id: Cloudflare יוצר מסד נתונים חדש וריק בהתקנה הראשונה
[[d1_databases]]
binding = "DB"
database_name = "employee-profiles"
